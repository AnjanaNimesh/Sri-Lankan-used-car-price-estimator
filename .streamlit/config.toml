[server]
headless = true
enableStaticServing = true   # serves ./static (the bundled Archivo font) so the dashboard also looks right offline

[theme]
base = "light"
primaryColor = "#0e5e66"
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#eaedf1"
textColor = "#1c2230"
borderColor = "#dde1e8"
font = "Archivo, sans-serif"
headingFont = "Archivo, sans-serif"
baseRadius = "6px"

[[theme.fontFaces]]
family = "Archivo"
url = "app/static/archivo-latin-wdth-normal.woff2"
weight = "100 900"
style = "normal"
